name: TrafficMonitor Custom x64 V2

on:
  push:
    branches:
      - trafficmonitor-custom-build
    paths:
      - 'trafficmonitor_remote/**'
      - '.github/workflows/trafficmonitor-custom-build-v2.yml'
  workflow_dispatch:

concurrency:
  group: trafficmonitor-custom-x64-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout integration files
        uses: actions/checkout@v4

      - name: Checkout TrafficMonitor V1.86
        uses: actions/checkout@v4
        with:
          repository: zhongyang219/TrafficMonitor
          ref: V1.86
          path: TrafficMonitorUpstream

      - name: Apply integrated remote monitor patches
        shell: pwsh
        run: |
          Copy-Item trafficmonitor_remote/RemoteMonitor.h TrafficMonitorUpstream/TrafficMonitor/RemoteMonitor.h -Force
          Copy-Item trafficmonitor_remote/RemoteMonitor.cpp TrafficMonitorUpstream/TrafficMonitor/RemoteMonitor.cpp -Force
          python trafficmonitor_remote/patch_trafficmonitor.py TrafficMonitorUpstream
          python trafficmonitor_remote/patch_icons.py TrafficMonitorUpstream
          python trafficmonitor_remote/patch_remote_runtime.py TrafficMonitorUpstream
          python trafficmonitor_remote/patch_runtime_fixes.py TrafficMonitorUpstream
          python trafficmonitor_remote/patch_password_auth.py TrafficMonitorUpstream
          python trafficmonitor_remote/patch_plink_transport.py TrafficMonitorUpstream
          python trafficmonitor_remote/patch_remote_topmost.py TrafficMonitorUpstream
          python trafficmonitor_remote/patch_serverbox_status_logic.py TrafficMonitorUpstream
          python trafficmonitor_remote/patch_plink_preflight_v2.py TrafficMonitorUpstream

      - name: Validate SSH V2 source
        shell: pwsh
        run: |
          $source = Get-Content TrafficMonitorUpstream/TrafficMonitor/RemoteMonitor.cpp -Raw
          if ($source -notmatch '__TM_SSH_OK__') { throw 'Plink preflight not injected' }
          if ($source -notmatch 'collector: process started with -batch -m') { throw 'Plink -m collector not injected' }
          if ($source -notmatch 'remote monitor 1.86.4 start') { throw 'mandatory start logging not injected' }
          if ($source -notmatch 'Tailscale / SSH Server \[1.86.4\]') { throw 'build marker missing' }
          if ($source -notmatch 'LR"TM_SCRIPT\(export LC_ALL=C') { throw 'multiline collector missing' }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build x64 Release
        shell: pwsh
        run: |
          msbuild TrafficMonitorUpstream/TrafficMonitor.sln -m -p:Configuration=Release -p:Platform=x64 -p:PlatformToolset=v143

      - name: Package complete distribution
        shell: pwsh
        run: |
          $releaseZip = Join-Path $PWD 'TrafficMonitor_V1.86_x64.zip'
          $releaseDir = Join-Path $PWD 'official_release'
          $packageDir = Join-Path $PWD 'package'

          Invoke-WebRequest -Uri 'https://github.com/zhongyang219/TrafficMonitor/releases/download/V1.86/TrafficMonitor_V1.86_x64.zip' -OutFile $releaseZip
          Expand-Archive -Path $releaseZip -DestinationPath $releaseDir -Force
          $officialExe = Get-ChildItem -Path $releaseDir -Recurse -Filter TrafficMonitor.exe | Select-Object -First 1
          if ($null -eq $officialExe) { throw 'official TrafficMonitor.exe not found' }
          $officialRoot = Split-Path -Parent $officialExe.FullName

          New-Item -ItemType Directory -Force $packageDir | Out-Null
          Copy-Item (Join-Path $officialRoot '*') $packageDir -Recurse -Force
          Copy-Item TrafficMonitorUpstream/Bin/x64/Release/TrafficMonitor.exe (Join-Path $packageDir 'TrafficMonitor.exe') -Force
          Copy-Item TrafficMonitorUpstream/Bin/x64/Release/*.dll $packageDir -Force -ErrorAction SilentlyContinue
          Copy-Item TrafficMonitorUpstream/LICENSE (Join-Path $packageDir 'LICENSE') -Force

          Invoke-WebRequest -Uri 'https://the.earth.li/~sgtatham/putty/0.84/w64/plink.exe' -OutFile (Join-Path $packageDir 'plink.exe')
          @'
          TrafficMonitor V1.86 + Tailscale/SSH build 1.86.4
          Password SSH flow:
          1. Plink preflight authenticates and confirms first-use host key using a harmless echo command.
          2. Monitoring runs with Plink -batch -m using a separate temporary Linux collector script.
          Diagnostics are always written to %APPDATA%\TrafficMonitor\remote_monitor.log.
          '@ | Set-Content (Join-Path $packageDir 'REMOTE_MONITOR_README.txt') -Encoding UTF8

          Get-FileHash (Join-Path $packageDir 'TrafficMonitor.exe') -Algorithm SHA256 | Format-List
          Get-FileHash (Join-Path $packageDir 'plink.exe') -Algorithm SHA256 | Format-List

      - name: Upload portable x64 package
        uses: actions/upload-artifact@v4
        with:
          name: TrafficMonitor-Tailscale-1.86.4-x64
          path: package/**
          if-no-files-found: error

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer | Out-Null
          @'
          [Setup]
          AppId={{A96D9152-6D85-4F82-87B4-62F56F990186}
          AppName=TrafficMonitor Tailscale
          AppVersion=1.86.4
          AppPublisher=TrafficMonitor custom build
          DefaultDirName={localappdata}\Programs\TrafficMonitorTailscale
          DefaultGroupName=TrafficMonitor Tailscale
          DisableProgramGroupPage=yes
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          OutputDir=installer
          OutputBaseFilename=TrafficMonitor_V1.86_Tailscale_1.86.4_Setup_x64
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          CloseApplications=yes
          RestartApplications=no
          UninstallDisplayIcon={app}\TrafficMonitor.exe
          SetupLogging=yes

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional shortcuts:"; Flags: unchecked

          [Files]
          Source: "package\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\TrafficMonitor Tailscale"; Filename: "{app}\TrafficMonitor.exe"
          Name: "{autodesktop}\TrafficMonitor Tailscale"; Filename: "{app}\TrafficMonitor.exe"; Tasks: desktopicon

          ; No automatic post-install launch. TrafficMonitor V1.86 requests elevation
          ; itself; omitting [Run] avoids CreateProcess error 740 in a lowest-privilege installer.
          '@ | Set-Content installer.iss -Encoding UTF8

          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          Get-FileHash installer/TrafficMonitor_V1.86_Tailscale_1.86.4_Setup_x64.exe -Algorithm SHA256 | Format-List

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TrafficMonitor-Tailscale-1.86.4-Installer-x64
          path: installer/TrafficMonitor_V1.86_Tailscale_1.86.4_Setup_x64.exe
          if-no-files-found: error
