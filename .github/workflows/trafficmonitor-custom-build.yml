name: TrafficMonitor Custom x64

on:
  push:
    branches:
      - trafficmonitor-custom-build
    paths:
      - 'trafficmonitor_remote/**'
      - '.github/workflows/trafficmonitor-custom-build.yml'
  workflow_dispatch:

concurrency:
  group: trafficmonitor-custom-x64
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout integration files
        uses: actions/checkout@v4

      - name: Checkout TrafficMonitor V1.86
        uses: actions/checkout@v4
        with:
          repository: zhongyang219/TrafficMonitor
          ref: V1.86
          path: TrafficMonitorUpstream

      - name: Inject integrated remote monitor
        shell: pwsh
        run: |
          Copy-Item trafficmonitor_remote/RemoteMonitor.h TrafficMonitorUpstream/TrafficMonitor/RemoteMonitor.h -Force
          Copy-Item trafficmonitor_remote/RemoteMonitor.cpp TrafficMonitorUpstream/TrafficMonitor/RemoteMonitor.cpp -Force
          python trafficmonitor_remote/patch_trafficmonitor.py TrafficMonitorUpstream
          python trafficmonitor_remote/patch_icons.py TrafficMonitorUpstream
          python trafficmonitor_remote/patch_remote_runtime.py TrafficMonitorUpstream
          python trafficmonitor_remote/patch_runtime_fixes.py TrafficMonitorUpstream
          python trafficmonitor_remote/patch_password_auth.py TrafficMonitorUpstream

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build x64 Release
        shell: pwsh
        run: |
          msbuild TrafficMonitorUpstream/TrafficMonitor.sln -m -p:Configuration=Release -p:Platform=x64 -p:PlatformToolset=v143

      - name: Package full patched source
        shell: pwsh
        run: |
          $sourceRoot = Join-Path $PWD 'full_source_package'
          $patchedRoot = Join-Path $sourceRoot 'TrafficMonitor-V1.86-Tailscale'
          New-Item -ItemType Directory -Force $patchedRoot | Out-Null
          Copy-Item (Join-Path $PWD 'TrafficMonitorUpstream/*') $patchedRoot -Recurse -Force

          $integrationDir = Join-Path $patchedRoot '_integration'
          New-Item -ItemType Directory -Force $integrationDir | Out-Null
          Copy-Item (Join-Path $PWD 'trafficmonitor_remote/*') $integrationDir -Recurse -Force
          Copy-Item (Join-Path $PWD '.github/workflows/trafficmonitor-custom-build.yml') (Join-Path $integrationDir 'trafficmonitor-custom-build.yml') -Force

          @'
          # TrafficMonitor V1.86 + Tailscale/SSH full source

          Complete source tree with the integrated remote monitor and runtime fixes already applied.

          Tested build target:
          - Windows Server 2022
          - Visual Studio 2022 / MSVC v143
          - x64 Release

          Build command:
          msbuild TrafficMonitor.sln -m -p:Configuration=Release -p:Platform=x64 -p:PlatformToolset=v143

          Fixes/features:
          - always-on-top survives 1-row/3-row resizing and modal settings
          - SSH monitoring script is streamed to `sh -s`, avoiding nested shell quoting failures
          - tailscale0 RX/TX counters are preferred, with non-loopback fallback
          - SSH stdout is polled without a permanently blocking ReadFile
          - remote settings can be reopened repeatedly
          - custom skin background/mask is extended without vertically stretching the original skin
          - SSH private key, ssh-agent and password authentication
          - password is stored with Windows DPAPI, not plaintext in the INI file
          '@ | Set-Content (Join-Path $patchedRoot 'TAILSCALE_SOURCE_README.md') -Encoding UTF8

          Compress-Archive -Path (Join-Path $sourceRoot '*') -DestinationPath (Join-Path $PWD 'TrafficMonitor_V1.86_Tailscale_Full_Source.zip') -Force

      - name: Upload full source
        uses: actions/upload-artifact@v4
        with:
          name: TrafficMonitor-Tailscale-Full-Source
          path: TrafficMonitor_V1.86_Tailscale_Full_Source.zip
          if-no-files-found: error

      - name: Package complete V1.86 distribution
        shell: pwsh
        run: |
          $releaseZip = Join-Path $PWD 'TrafficMonitor_V1.86_x64.zip'
          $releaseDir = Join-Path $PWD 'official_release'
          $packageDir = Join-Path $PWD 'package'

          Invoke-WebRequest -Uri 'https://github.com/zhongyang219/TrafficMonitor/releases/download/V1.86/TrafficMonitor_V1.86_x64.zip' -OutFile $releaseZip
          Expand-Archive -Path $releaseZip -DestinationPath $releaseDir -Force

          $officialExe = Get-ChildItem -Path $releaseDir -Recurse -Filter TrafficMonitor.exe | Select-Object -First 1
          if ($null -eq $officialExe) { throw 'TrafficMonitor.exe not found in official release zip' }
          $officialRoot = Split-Path -Parent $officialExe.FullName

          New-Item -ItemType Directory -Force $packageDir | Out-Null
          Copy-Item (Join-Path $officialRoot '*') $packageDir -Recurse -Force
          Copy-Item TrafficMonitorUpstream/Bin/x64/Release/TrafficMonitor.exe (Join-Path $packageDir 'TrafficMonitor.exe') -Force
          Copy-Item TrafficMonitorUpstream/Bin/x64/Release/*.dll $packageDir -Force -ErrorAction SilentlyContinue
          Copy-Item TrafficMonitorUpstream/LICENSE (Join-Path $packageDir 'LICENSE') -Force

          @'
          TrafficMonitor V1.86 + integrated Tailscale / SSH server monitor

          Right-click the TrafficMonitor main window -> Tailscale / SSH Server...
          Configure Tailscale IP/hostname, SSH user, port, and either private key or password.

          Disabled: original TrafficMonitor layout only.
          Enabled: the same TrafficMonitor window adds two rows:
          row 2: remote upload / download / uptime
          row 3: temperature / root disk usage / CPU usage

          The Linux server does not need a monitoring agent.
          Authentication: private key, ssh-agent, or password.
          Passwords are protected using Windows DPAPI.
          Settings: %APPDATA%\TrafficMonitor\remote_monitor.ini
          '@ | Set-Content (Join-Path $packageDir 'REMOTE_MONITOR_README.txt') -Encoding UTF8

          Get-FileHash (Join-Path $packageDir 'TrafficMonitor.exe') -Algorithm SHA256 | Format-List

      - name: Upload complete x64 package
        uses: actions/upload-artifact@v4
        with:
          name: TrafficMonitor-Tailscale-x64
          path: package/**
          if-no-files-found: error
