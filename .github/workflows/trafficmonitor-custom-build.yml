name: TrafficMonitor Custom x64

on:
  push:
    branches:
      - trafficmonitor-custom-build
    paths:
      - 'trafficmonitor_remote/**'
      - '.github/workflows/trafficmonitor-custom-build.yml'
  workflow_dispatch:

concurrency:
  group: trafficmonitor-custom-x64
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout integration files
        uses: actions/checkout@v4

      - name: Checkout TrafficMonitor V1.86
        uses: actions/checkout@v4
        with:
          repository: zhongyang219/TrafficMonitor
          ref: V1.86
          path: TrafficMonitorUpstream

      - name: Inject integrated remote monitor
        shell: pwsh
        run: |
          Copy-Item trafficmonitor_remote/RemoteMonitor.h TrafficMonitorUpstream/TrafficMonitor/RemoteMonitor.h -Force
          Copy-Item trafficmonitor_remote/RemoteMonitor.cpp TrafficMonitorUpstream/TrafficMonitor/RemoteMonitor.cpp -Force
          python trafficmonitor_remote/patch_trafficmonitor.py TrafficMonitorUpstream
          python trafficmonitor_remote/patch_icons.py TrafficMonitorUpstream
          python trafficmonitor_remote/patch_remote_runtime.py TrafficMonitorUpstream
          python trafficmonitor_remote/patch_runtime_fixes.py TrafficMonitorUpstream
          python trafficmonitor_remote/patch_password_auth.py TrafficMonitorUpstream
          python trafficmonitor_remote/patch_plink_transport.py TrafficMonitorUpstream
          python trafficmonitor_remote/patch_remote_topmost.py TrafficMonitorUpstream

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build x64 Release
        shell: pwsh
        run: |
          msbuild TrafficMonitorUpstream/TrafficMonitor.sln -m -p:Configuration=Release -p:Platform=x64 -p:PlatformToolset=v143

      - name: Package full patched source
        shell: pwsh
        run: |
          $sourceRoot = Join-Path $PWD 'full_source_package'
          $patchedRoot = Join-Path $sourceRoot 'TrafficMonitor-V1.86-Tailscale'
          New-Item -ItemType Directory -Force $patchedRoot | Out-Null
          Copy-Item (Join-Path $PWD 'TrafficMonitorUpstream/*') $patchedRoot -Recurse -Force

          $integrationDir = Join-Path $patchedRoot '_integration'
          New-Item -ItemType Directory -Force $integrationDir | Out-Null
          Copy-Item (Join-Path $PWD 'trafficmonitor_remote/*') $integrationDir -Recurse -Force
          Copy-Item (Join-Path $PWD '.github/workflows/trafficmonitor-custom-build.yml') (Join-Path $integrationDir 'trafficmonitor-custom-build.yml') -Force

          @'
          # TrafficMonitor V1.86 + Tailscale/SSH full source

          Complete source tree with the integrated remote monitor and runtime fixes already applied.

          Tested build target:
          - Windows Server 2022
          - Visual Studio 2022 / MSVC v143
          - x64 Release

          Build command:
          msbuild TrafficMonitor.sln -m -p:Configuration=Release -p:Platform=x64 -p:PlatformToolset=v143

          Fixes/features:
          - remote monitor mode remains TOPMOST over fullscreen applications
          - legacy hide-on-fullscreen is ignored while remote monitoring is enabled
          - password SSH uses bundled PuTTY Plink instead of depending on Windows OpenSSH ASKPASS
          - key / ssh-agent authentication can still use Windows OpenSSH
          - SSH monitoring script is streamed to `sh -s`
          - tailscale0 RX/TX counters are preferred, with non-loopback fallback
          - SSH stdout is polled without a permanently blocking ReadFile
          - non-monitor SSH errors are logged to %APPDATA%\TrafficMonitor\remote_monitor.log
          - remote settings can be reopened repeatedly
          - custom skin background/mask is extended without vertically stretching the original skin
          - password is stored with Windows DPAPI, not plaintext in the INI file
          '@ | Set-Content (Join-Path $patchedRoot 'TAILSCALE_SOURCE_README.md') -Encoding UTF8

          Compress-Archive -Path (Join-Path $sourceRoot '*') -DestinationPath (Join-Path $PWD 'TrafficMonitor_V1.86_Tailscale_Full_Source.zip') -Force

      - name: Upload full source
        uses: actions/upload-artifact@v4
        with:
          name: TrafficMonitor-Tailscale-Full-Source
          path: TrafficMonitor_V1.86_Tailscale_Full_Source.zip
          if-no-files-found: error

      - name: Package complete V1.86 distribution
        shell: pwsh
        run: |
          $releaseZip = Join-Path $PWD 'TrafficMonitor_V1.86_x64.zip'
          $releaseDir = Join-Path $PWD 'official_release'
          $packageDir = Join-Path $PWD 'package'

          Invoke-WebRequest -Uri 'https://github.com/zhongyang219/TrafficMonitor/releases/download/V1.86/TrafficMonitor_V1.86_x64.zip' -OutFile $releaseZip
          Expand-Archive -Path $releaseZip -DestinationPath $releaseDir -Force

          $officialExe = Get-ChildItem -Path $releaseDir -Recurse -Filter TrafficMonitor.exe | Select-Object -First 1
          if ($null -eq $officialExe) { throw 'TrafficMonitor.exe not found in official release zip' }
          $officialRoot = Split-Path -Parent $officialExe.FullName

          New-Item -ItemType Directory -Force $packageDir | Out-Null
          Copy-Item (Join-Path $officialRoot '*') $packageDir -Recurse -Force
          Copy-Item TrafficMonitorUpstream/Bin/x64/Release/TrafficMonitor.exe (Join-Path $packageDir 'TrafficMonitor.exe') -Force
          Copy-Item TrafficMonitorUpstream/Bin/x64/Release/*.dll $packageDir -Force -ErrorAction SilentlyContinue
          Copy-Item TrafficMonitorUpstream/LICENSE (Join-Path $packageDir 'LICENSE') -Force

          # Bundle official PuTTY Plink 0.84 x64 for reliable non-interactive password SSH.
          Invoke-WebRequest -Uri 'https://the.earth.li/~sgtatham/putty/0.84/w64/plink.exe' -OutFile (Join-Path $packageDir 'plink.exe')
          @'
          PuTTY is copyright 1997-2026 Simon Tatham.

          Permission is hereby granted, free of charge, to any person obtaining a copy of this software and associated documentation files (the "Software"), to deal in the Software without restriction, including without limitation the rights to use, copy, modify, merge, publish, distribute, sublicense, and/or sell copies of the Software, and to permit persons to whom the Software is furnished to do so, subject to the following conditions:

          The above copyright notice and this permission notice shall be included in all copies or substantial portions of the Software.

          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM, OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE SOFTWARE.
          '@ | Set-Content (Join-Path $packageDir 'PUTTY_LICENSE.txt') -Encoding UTF8

          @'
          TrafficMonitor V1.86 + integrated Tailscale / SSH server monitor

          Right-click the TrafficMonitor main window -> Tailscale / SSH Server...
          Configure Tailscale IP/hostname, SSH user, port, and either private key or password.

          Disabled: original TrafficMonitor layout only.
          Enabled: the same TrafficMonitor window adds two rows and stays visible/topmost even when another application goes fullscreen.
          row 2: remote upload / download / uptime
          row 3: temperature / root disk usage / CPU usage

          Password SSH is handled by bundled PuTTY Plink. Key/agent auth can use Windows OpenSSH.
          The Linux server does not need a monitoring agent.
          Passwords are protected using Windows DPAPI in the saved settings.
          Settings: %APPDATA%\TrafficMonitor\remote_monitor.ini
          Diagnostics: %APPDATA%\TrafficMonitor\remote_monitor.log
          '@ | Set-Content (Join-Path $packageDir 'REMOTE_MONITOR_README.txt') -Encoding UTF8

          Get-FileHash (Join-Path $packageDir 'TrafficMonitor.exe') -Algorithm SHA256 | Format-List
          Get-FileHash (Join-Path $packageDir 'plink.exe') -Algorithm SHA256 | Format-List

      - name: Upload complete x64 package
        uses: actions/upload-artifact@v4
        with:
          name: TrafficMonitor-Tailscale-x64
          path: package/**
          if-no-files-found: error

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer | Out-Null
          @'
          [Setup]
          AppId={{A96D9152-6D85-4F82-87B4-62F56F990186}
          AppName=TrafficMonitor Tailscale
          AppVersion=1.86.2
          AppPublisher=TrafficMonitor custom build
          DefaultDirName={localappdata}\Programs\TrafficMonitor
          DefaultGroupName=TrafficMonitor
          DisableProgramGroupPage=yes
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          OutputDir=installer
          OutputBaseFilename=TrafficMonitor_V1.86_Tailscale_Fixed_Setup_x64
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          CloseApplications=yes
          RestartApplications=no
          UninstallDisplayIcon={app}\TrafficMonitor.exe
          SetupLogging=yes

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional shortcuts:"; Flags: unchecked

          [Files]
          Source: "package\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\TrafficMonitor"; Filename: "{app}\TrafficMonitor.exe"
          Name: "{autodesktop}\TrafficMonitor"; Filename: "{app}\TrafficMonitor.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\TrafficMonitor.exe"; Description: "Launch TrafficMonitor"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content installer.iss -Encoding UTF8

          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found: $iscc" }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          Get-FileHash installer/TrafficMonitor_V1.86_Tailscale_Fixed_Setup_x64.exe -Algorithm SHA256 | Format-List

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: TrafficMonitor-Tailscale-Installer-x64
          path: installer/TrafficMonitor_V1.86_Tailscale_Fixed_Setup_x64.exe
          if-no-files-found: error
